name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Compile check
        run: |
          python -m py_compile mock_core/*.py local_script/*.py tests/*.py

      - name: Lint with ruff
        run: ruff check mock_core local_script tests

      - name: Type check with mypy
        run: mypy mock_core local_script tests

      - name: Run pytest
        run: pytest tests/ -q

  node:
    name: Node browser-extension tests
    runs-on: ubuntu-latest
    needs: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Start mock_core and run Node tests
        run: |
          python -m uvicorn mock_core.main:app --port 9000 &
          UVICORN_PID=$!
          sleep 2
          CORE_URL=http://127.0.0.1:9000 SESSION_TOKEN=sess_test node browser_extension/test-node.mjs
          kill $UVICORN_PID
