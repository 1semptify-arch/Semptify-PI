[project]
name = "semptify-pi"
version = "0.1.0"
description = "Semptify Plugin Interface prototype - decoupled from Semptify Core"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
]

[project.scripts]
mock-core = "mock_core.main:run"
local-plugin = "local_script.semtify_plugin:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_core", "local_script"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["mock_core", "local_script", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# The browser extension is a Node/ESM package and is not included in the Python wheel.
